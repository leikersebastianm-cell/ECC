name: Deploy TRA Control Center

on:
  push:
    branches: [main]
    paths:
      - "tra-control-center/**"
      - ".github/workflows/tra-dashboard-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "tra-control-center-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload TRA Control Center
        uses: actions/upload-pages-artifact@v3
        with:
          path: tra-control-center
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
